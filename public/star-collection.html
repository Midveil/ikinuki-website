<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星あつめ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#070b1a;color:#d5def2;font-family:"DM Mono",monospace}.sky{position:fixed;inset:0;background:#08132b url("pixel-night-background.png") center/cover no-repeat;image-rendering:pixelated;transition:filter .5s}.cat{position:fixed;z-index:2;bottom:-1vh;width:clamp(180px,22vw,320px);right:12vw;image-rendering:pixelated;filter:drop-shadow(1px 0 0 #4f9fff) drop-shadow(-1px 0 0 #4f9fff) drop-shadow(0 1px 0 #4f9fff) drop-shadow(0 -1px 0 #4f9fff) drop-shadow(0 8px 20px rgba(0,0,0,.65));animation:catStill 4.8s steps(2,end) infinite}.panel{position:fixed;z-index:4;top:28px;right:clamp(24px,5vw,76px);display:flex;gap:12px;align-items:center;font-size:11px;letter-spacing:.12em}.panel button,.again{border:1px solid rgba(230,233,242,.28);border-radius:99px;padding:10px 14px;background:rgba(9,15,33,.45);color:#eae7dc;font:11px "DM Mono",monospace;cursor:pointer}.hint{position:fixed;z-index:4;top:74px;right:clamp(24px,5vw,76px);font-size:10px;letter-spacing:.08em}.star{position:fixed;z-index:3;top:-30px;width:24px;height:24px;color:#f8ff82;font:24px/1 "DM Mono",monospace;text-shadow:2px 0 #32d9ff,-2px 0 #32d9ff,0 2px #32d9ff,0 -2px #32d9ff,0 0 6px #48e7ff,0 0 16px rgba(69,221,255,.95),0 0 28px rgba(212,108,255,.72);animation:fall 3.5s steps(36,end) forwards,neon .65s steps(2,end) infinite}.result{position:fixed;z-index:5;inset:0;display:none;place-items:center;background:rgba(4,8,24,.35)}.result.show{display:grid}.card{text-align:center;padding:30px 38px;border:1px solid rgba(255,232,174,.48);background:rgba(10,18,41,.85)}.card p{font-size:14px}@keyframes fall{to{transform:translateY(110vh) rotate(120deg);opacity:.3}}@keyframes neon{50%{color:#fff;text-shadow:2px 0 #dc74ff,-2px 0 #dc74ff,0 2px #dc74ff,0 -2px #dc74ff,0 0 11px #fff,0 0 24px #4be9ff}}@keyframes catStill{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
:root{--moon-glow:0;--star-bright:1}.sky::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 22% 25%,rgba(226,243,255,.86) 0 3%,rgba(119,207,255,.34) 8%,transparent 21%);mix-blend-mode:screen;opacity:var(--moon-glow);transition:opacity .5s}.star{filter:brightness(var(--star-bright))}
.home-link{position:fixed;z-index:6;top:27px;left:clamp(24px,5vw,76px);display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid rgba(230,233,242,.36);border-radius:999px;background:rgba(9,15,33,.62);color:#eae7dc;text-decoration:none;font:11px "DM Mono",monospace;letter-spacing:.1em;backdrop-filter:blur(10px);transition:.25s}.home-link:hover{color:#12182a;background:#ffe8ae;border-color:#ffe8ae;box-shadow:0 0 24px rgba(255,232,174,.26)}
</style></head><body><div class="sky"></div><a class="home-link" href="night-room.html">← ホームへ戻る</a><img class="cat" src="game-cat-muted.png" alt="黒猫"><div class="panel"><span id="clock">00:30</span><span>星 <b id="score">0</b></span><button id="left">←</button><button id="right">→</button></div><div class="hint">← → で黒猫を動かそう</div><div class="result" id="result"><div class="card"><p id="message"></p><button class="again" id="again">もう一度あつめる</button></div></div><script>
const cat=document.querySelector('.cat'),sky=document.querySelector('.sky'),clock=document.querySelector('#clock'),scoreEl=document.querySelector('#score'),result=document.querySelector('#result'),message=document.querySelector('#message'),root=document.documentElement;let x=0,score=0,seconds=30,timer,spawner,stars=[];function move(n){x=Math.max(0,Math.min(innerWidth-cat.offsetWidth,x+n));cat.style.right='auto';cat.style.left=x+'px'}function spawn(){const s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(8+Math.random()*84)+'vw';document.body.append(s);stars.push(s);const hit=setInterval(()=>{const a=cat.getBoundingClientRect(),b=s.getBoundingClientRect();if(b.bottom>a.top+18&&b.top<a.bottom&&b.right>a.left+16&&b.left<a.right-16){score++;scoreEl.textContent=score;const level=Math.min(score,8);sky.style.filter='brightness('+(1-level*.05)+')';root.style.setProperty('--moon-glow',level*.1);root.style.setProperty('--star-bright',1+level*.12);s.remove();clearInterval(hit);}},50);setTimeout(()=>{clearInterval(hit);s.remove()},3600)}function end(){clearInterval(timer);clearInterval(spawner);stars.forEach(s=>s.remove());stars=[];message.textContent='今夜は '+score+' 個の星を集めたよ。';result.classList.add('show')}function start(){result.classList.remove('show');score=0;seconds=30;scoreEl.textContent=0;sky.style.filter='none';root.style.setProperty('--moon-glow',0);root.style.setProperty('--star-bright',1);x=Math.max(0,innerWidth-cat.offsetWidth-80);cat.style.right='auto';cat.style.left=x+'px';clock.textContent='00:30';spawner=setInterval(spawn,850);spawn();timer=setInterval(()=>{seconds--;clock.textContent='00:'+String(seconds).padStart(2,'0');if(seconds<=0)end()},1000)}document.querySelector('#left').onclick=()=>move(-55);document.querySelector('#right').onclick=()=>move(55);document.querySelector('#again').onclick=start;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-45)}if(e.key==='ArrowRight'){e.preventDefault();move(45)}});start();
</script></body></html>
