<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星あつめ</title><link rel="prefetch" href="night-room.html"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#070b1a;color:#d5def2;font-family:"DM Mono",monospace}.sky{position:fixed;inset:0;isolation:isolate;background:#08132b url("pixel-night-background.png") center/cover no-repeat;image-rendering:pixelated}.cat{position:fixed;z-index:2;bottom:-1vh;width:clamp(180px,22vw,320px);right:12vw;image-rendering:pixelated;filter:drop-shadow(1px 0 0 #4f9fff) drop-shadow(-1px 0 0 #4f9fff) drop-shadow(0 1px 0 #4f9fff) drop-shadow(0 -1px 0 #4f9fff) drop-shadow(0 8px 20px rgba(0,0,0,.65));animation:catStill 4.8s steps(2,end) infinite}.panel{position:fixed;z-index:4;top:28px;right:clamp(24px,5vw,76px);display:flex;gap:12px;align-items:center;font-size:11px;letter-spacing:.12em}.panel button{border:1px solid rgba(230,233,242,.28);border-radius:99px;padding:10px 14px;background:rgba(9,15,33,.45);color:#eae7dc;font:11px "DM Mono",monospace;cursor:pointer}.hint{position:fixed;z-index:4;top:74px;right:clamp(24px,5vw,76px);font-size:10px;letter-spacing:.08em}.star{position:fixed;z-index:3;top:-30px;width:24px;height:24px;color:#f8ff82;font:24px/1 "DM Mono",monospace;text-shadow:2px 0 #32d9ff,-2px 0 #32d9ff,0 2px #32d9ff,0 -2px #32d9ff,0 0 6px #48e7ff,0 0 16px rgba(69,221,255,.95),0 0 28px rgba(212,108,255,.72);animation:fall 3.5s steps(36,end) forwards,neon .65s steps(2,end) infinite}.result{position:fixed;z-index:5;inset:0;display:none;place-items:center;padding:22px;background:rgba(4,8,24,.66);backdrop-filter:blur(3px)}.result.show{display:grid}.card{width:min(100%,430px);padding:34px 32px 30px;text-align:center;border:2px solid rgba(255,224,139,.72);background:linear-gradient(180deg,rgba(15,29,64,.97),rgba(6,15,39,.97));box-shadow:0 0 0 4px rgba(29,68,137,.5),0 18px 60px rgba(0,0,0,.52),inset 0 0 28px rgba(92,145,255,.12);clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,100% 4px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),0 calc(100% - 4px),0 8px,8px 8px)}.card::before{content:"GAME COMPLETE";display:block;margin-bottom:17px;color:#8fb9ff;font-size:9px;letter-spacing:.24em;text-shadow:0 0 9px rgba(80,151,255,.58)}.card p{margin:0;color:#fff1c9;font-size:14px;line-height:1.8;letter-spacing:.05em}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:27px}.choice{display:flex;min-height:48px;align-items:center;justify-content:center;padding:12px 16px;touch-action:manipulation;border:1px solid rgba(255,231,169,.62);color:#f6ead1;text-decoration:none;font:11px "DM Mono",monospace;letter-spacing:.06em;cursor:pointer;transition:filter .16s,transform .16s,box-shadow .16s}.choice:hover,.choice:focus-visible{filter:brightness(1.12);transform:translateY(-2px);outline:none}.choice-primary{background:linear-gradient(180deg,#e6c982,#c6a45d);color:#101a31;box-shadow:0 0 16px rgba(255,222,137,.18)}.choice-secondary{background:rgba(18,39,81,.78);box-shadow:inset 0 0 14px rgba(83,145,255,.12)}@keyframes fall{to{transform:translateY(110vh) rotate(120deg);opacity:.3}}@keyframes neon{50%{color:#fff;text-shadow:2px 0 #dc74ff,-2px 0 #dc74ff,0 2px #dc74ff,0 -2px #dc74ff,0 0 11px #fff,0 0 24px #4be9ff}}@keyframes catStill{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
:root{--moon-glow:0;--moon-x:82%;--moon-y:16%;--moon-radius:120px;--sky-dark:0;--star-bright:1}.sky::before,.sky::after{content:"";position:absolute;inset:0;pointer-events:none;transition:opacity .5s}.sky::before{z-index:0;background:#020617;opacity:var(--sky-dark)}.sky::after{z-index:1;background:url("pixel-night-background.png") center/cover no-repeat;image-rendering:pixelated;mix-blend-mode:screen;opacity:var(--moon-glow);-webkit-mask-image:radial-gradient(circle var(--moon-radius) at var(--moon-x) var(--moon-y),#000 0 54%,rgba(0,0,0,.7) 72%,transparent 100%);mask-image:radial-gradient(circle var(--moon-radius) at var(--moon-x) var(--moon-y),#000 0 54%,rgba(0,0,0,.7) 72%,transparent 100%)}.star{filter:brightness(var(--star-bright))}
@media(pointer:coarse),(max-width:700px){.panel button{display:none}.panel{right:18px}.hint{right:18px;font-size:0}.hint::after{content:"画面を左右になぞってノワールを動かそう";font-size:10px}.cat{width:clamp(150px,38vw,210px)}.result-actions{grid-template-columns:1fr}.card{padding:30px 22px 24px}.choice{min-height:46px}}
</style></head><body><div class="sky"></div><img class="cat" src="game-cat-muted.png" alt="黒猫"><div class="panel"><span id="clock">00:30</span><span>星 <b id="score">0</b></span><button id="left">←</button><button id="right">→</button></div><div class="hint">← → で黒猫を動かそう</div><div class="result" id="result"><div class="card"><p id="message"></p><div class="result-actions"><button class="choice choice-primary" id="again">もう一度あつめる</button><a class="choice choice-secondary home-choice" href="night-room.html">ホームに戻る</a></div></div></div><script>
const cat=document.querySelector('.cat'),clock=document.querySelector('#clock'),scoreEl=document.querySelector('#score'),result=document.querySelector('#result'),message=document.querySelector('#message'),root=document.documentElement;
let x=0,score=0,seconds=30,timer,spawner,stars=[],dragging=false,dragStartX=0,dragCatX=0;
function placeCat(n){x=Math.max(0,Math.min(innerWidth-cat.offsetWidth,n));cat.style.right='auto';cat.style.left=x+'px'}
function move(n){placeCat(x+n)}
function syncMoon(){const imageW=1536,imageH=1024,moonSourceX=1264,moonSourceY=164,scale=Math.max(innerWidth/imageW,innerHeight/imageH),renderW=imageW*scale,renderH=imageH*scale;root.style.setProperty('--moon-x',((innerWidth-renderW)/2+moonSourceX*scale)+'px');root.style.setProperty('--moon-y',((innerHeight-renderH)/2+moonSourceY*scale)+'px');root.style.setProperty('--moon-radius',(118*scale)+'px')}
function spawn(){const s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(8+Math.random()*84)+'vw';document.body.append(s);stars.push(s);const hit=setInterval(()=>{const a=cat.getBoundingClientRect(),b=s.getBoundingClientRect();if(b.bottom>a.top+18&&b.top<a.bottom&&b.right>a.left+16&&b.left<a.right-16){score++;scoreEl.textContent=score;const level=Math.min(score,8);root.style.setProperty('--sky-dark',level*.05);root.style.setProperty('--moon-glow',level*.115);root.style.setProperty('--star-bright',1+level*.12);s.remove();clearInterval(hit)}},50);setTimeout(()=>{clearInterval(hit);s.remove()},3600)}
function end(){clearInterval(timer);clearInterval(spawner);stars.forEach(s=>s.remove());stars=[];message.textContent='今夜は '+score+' 個の星を集めたよ。';result.classList.add('show')}
function start(){result.classList.remove('show');score=0;seconds=30;scoreEl.textContent=0;root.style.setProperty('--sky-dark',0);root.style.setProperty('--moon-glow',0);root.style.setProperty('--star-bright',1);placeCat(Math.max(0,innerWidth-cat.offsetWidth-80));clock.textContent='00:30';spawner=setInterval(spawn,850);spawn();timer=setInterval(()=>{seconds--;clock.textContent='00:'+String(seconds).padStart(2,'0');if(seconds<=0)end()},1000)}
function isUi(target){return target.closest('.panel,.result')}
const homeChoice=document.querySelector('.home-choice');homeChoice.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){e.preventDefault();e.stopPropagation();location.assign(homeChoice.href)}});
addEventListener('pointerdown',e=>{if(isUi(e.target))return;dragging=true;dragStartX=e.clientX;dragCatX=x});
addEventListener('pointermove',e=>{if(!dragging)return;placeCat(dragCatX+e.clientX-dragStartX);e.preventDefault()},{passive:false});
addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);
document.querySelector('#left').onclick=()=>move(-55);document.querySelector('#right').onclick=()=>move(55);document.querySelector('#again').onclick=start;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-45)}if(e.key==='ArrowRight'){e.preventDefault();move(45)}});
addEventListener('resize',()=>{syncMoon();placeCat(x)});syncMoon();start();
</script></body></html>
